name: Update Profile Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime

          USERNAME = "Priyanshu-1729"
          README = "README.md"

          # Find merged PRs authored by this account.
          query = urllib.parse.quote(
              f"author:{USERNAME} is:pr is:merged"
          )

          url = (
              "https://api.github.com/search/issues"
              f"?q={query}&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          contributions = []

          for item in data.get("items", []):
              repository_url = item["repository_url"]

              parts = repository_url.rstrip("/").split("/")
              owner = parts[-2]
              repo = parts[-1]

              # Ignore PRs in your own repositories.
              if owner.lower() == USERNAME.lower():
                  continue

              # Extract repository and PR information.
              contributions.append({
                  "owner": owner,
                  "repo": repo,
                  "title": item["title"],
                  "url": item["html_url"],
                  "number": item["number"],
                  "updated_at": item["updated_at"],
              })

          # Newest activity first.
          contributions.sort(
              key=lambda item: item["updated_at"],
              reverse=True
          )

          # Keep the profile compact.
          contributions = contributions[:6]

          lines = [
              "### 🌍 Selected Contributions",
              "",
          ]

          if contributions:
              for item in contributions:
                  repository = (
                      f"[{item['owner']}/{item['repo']}]"
                      f"(https://github.com/{item['owner']}/{item['repo']})"
                  )

                  pr = (
                      f"[{item['title']}]"
                      f"({item['url']})"
                  )

                  lines.append(
                      f"- **{repository}** — {pr} · ✅ Merged"
                  )

                  lines.append("")
          else:
              lines.append(
                  "_No external merged pull requests found yet._"
              )
              lines.append("")

          new_section = "\n".join(lines).rstrip()

          with open(README, "r", encoding="utf-8") as file:
              readme = file.read()

          start_marker = "<!-- CONTRIBUTIONS:START -->"
          end_marker = "<!-- CONTRIBUTIONS:END -->"

          if start_marker not in readme:
              raise SystemExit(
                  "CONTRIBUTIONS:START marker not found in README.md"
              )

          if end_marker not in readme:
              raise SystemExit(
                  "CONTRIBUTIONS:END marker not found in README.md"
              )

          start = readme.index(start_marker) + len(start_marker)
          end = readme.index(end_marker)

          updated_readme = (
              readme[:start]
              + "\n\n"
              + new_section
              + "\n\n"
              + readme[end:]
          )

          with open(README, "w", encoding="utf-8") as file:
              file.write(updated_readme)

          print("Contribution section updated.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile contributions"
          git push
